<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Status</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            background: #f8fafc;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .status-item:last-child {
            border-bottom: none;
        }
        
        .status-label {
            font-size: 13px;
            color: #4b5563;
        }
        
        .status-value {
            font-size: 13px;
            font-weight: 600;
        }
        
        .status-connected { color: #059669; }
        .status-active { color: #3b82f6; }
        .status-warning { color: #d97706; }
        .status-inactive { color: #6b7280; }
        
        .section-title {
            font-size: 14px;
            font-weight: 700;
            margin: 16px 0 8px 0;
            color: #1f2937;
        }
        
        .section-title:first-child {
            margin-top: 0;
        }
        
        .data-editor {
            margin-top: 16px;
        }
        
        .data-input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 8px;
        }
        
        .update-button {
            padding: 6px 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        
        .update-button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div class="section-title">System Status</div>
    <div class="status-item">
        <span class="status-label">Graphics Engine</span>
        <span class="status-value status-connected">Active</span>
    </div>
    <div class="status-item">
        <span class="status-label">Active Graphics</span>
        <span class="status-value status-active" id="active-count">0</span>
    </div>
    <div class="status-item">
        <span class="status-label">Current Scene</span>
        <span class="status-value" id="current-scene">None</span>
    </div>
    <div class="status-item">
        <span class="status-label">Regions Visible</span>
        <span class="status-value" id="regions-status">No</span>
    </div>

    <div class="section-title">News Ticker Settings</div>
    
    <div class="data-editor">
        <div style="display: flex; gap: 8px; margin-bottom: 8px;">
            <input type="number" class="data-input" id="ticker-speed" placeholder="Speed (seconds)" min="5" max="60" value="25" style="flex: 1;">
            <select class="data-input" id="ticker-direction" style="flex: 1;">
                <option value="ltr">Left to Right</option>
                <option value="rtl">Right to Left</option>
            </select>
        </div>
        <input type="text" class="data-input" id="ticker-separator" placeholder="Separator" value=" *** " style="margin-bottom: 8px;">
        <button class="update-button" id="update-ticker-settings">Update Ticker Settings</button>
    </div>

    <div class="data-editor">
        <input type="file" class="data-input" id="ticker-file" accept=".txt" style="margin-bottom: 8px;">
        <button class="update-button" id="upload-ticker">Upload News Ticker File</button>
        <div style="font-size: 11px; color: #6b7280; margin-top: 4px;">
            Upload a .txt file with one news item per line
        </div>
    </div>

    <div class="data-editor">
        <textarea class="data-input" id="manual-news" placeholder="Enter news items, one per line..." rows="4" style="resize: vertical; margin-bottom: 8px;"></textarea>
        <button class="update-button" id="update-manual-news">Update News Manually</button>
    </div>

    <div class="section-title">Quick Data Update</div>
    <div class="data-editor">
        <input type="text" class="data-input" id="lower-third-title" placeholder="Lower Third Title">
        <input type="text" class="data-input" id="lower-third-subtitle" placeholder="Lower Third Subtitle">
        <button class="update-button" id="update-lower-third">Update Lower Third</button>
    </div>

    <div class="data-editor">
        <input type="text" class="data-input" id="home-team" placeholder="Home Team">
        <input type="number" class="data-input" id="home-score" placeholder="Home Score">
        <input type="text" class="data-input" id="away-team" placeholder="Away Team">
        <input type="number" class="data-input" id="away-score" placeholder="Away Score">
        <button class="update-button" id="update-score">Update Score</button>
    </div>

    <script>
        const activeGraphics = nodecg.Replicant('activeGraphics');
        const currentScene = nodecg.Replicant('currentScene');
        const showRegions = nodecg.Replicant('showRegions');
        const graphicsData = nodecg.Replicant('graphicsData');

        const sceneNames = {
            'intro': 'Show Introduction',
            'main-coverage': 'Main Coverage',
            'social-segment': 'Social Media Segment',
            'news-update': 'News Update'
        };

        // Update status displays
        activeGraphics.on('change', (newValue) => {
            document.getElementById('active-count').textContent = newValue ? newValue.length : 0;
        });

        currentScene.on('change', (newValue) => {
            const sceneElement = document.getElementById('current-scene');
            if (newValue && sceneNames[newValue]) {
                sceneElement.textContent = sceneNames[newValue];
                sceneElement.className = 'status-value status-active';
            } else {
                sceneElement.textContent = 'None';
                sceneElement.className = 'status-value status-inactive';
            }
        });

        showRegions.on('change', (newValue) => {
            const regionsElement = document.getElementById('regions-status');
            regionsElement.textContent = newValue ? 'Yes' : 'No';
            regionsElement.className = newValue ? 'status-value status-warning' : 'status-value status-inactive';
        });

        // Load current ticker settings
        graphicsData.on('change', (newValue) => {
            if (newValue && newValue.tickerSettings) {
                const settings = newValue.tickerSettings;
                document.getElementById('ticker-speed').value = settings.speed || 25;
                document.getElementById('ticker-direction').value = settings.direction || 'ltr';
                document.getElementById('ticker-separator').value = settings.separator || ' *** ';
            }
        });

        // Ticker settings update handler
        document.getElementById('update-ticker-settings').addEventListener('click', () => {
            const speed = parseInt(document.getElementById('ticker-speed').value) || 25;
            const direction = document.getElementById('ticker-direction').value || 'ltr';
            const separator = document.getElementById('ticker-separator').value || ' *** ';
            
            console.log('Sending ticker settings update:', { speed, direction, separator });
            
            nodecg.sendMessage('updateTickerSettings', {
                speed: speed,
                direction: direction,
                separator: separator
            });
            
            // Show feedback to user
            const button = document.getElementById('update-ticker-settings');
            const originalText = button.textContent;
            button.textContent = 'Updated!';
            button.style.background = '#059669';
            
            setTimeout(() => {
                button.textContent = originalText;
                button.style.background = '#3b82f6';
            }, 2000);
        });

        // Ticker file upload handler
        document.getElementById('upload-ticker').addEventListener('click', () => {
            const fileInput = document.getElementById('ticker-file');
            const file = fileInput.files[0];
            
            if (file && file.type === 'text/plain') {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const content = e.target.result;
                    
                    // Send file content to be saved
                    nodecg.sendMessage('uploadTickerFile', content, (response) => {
                        if (response && response.success) {
                            // Show success feedback
                            const button = document.getElementById('upload-ticker');
                            const originalText = button.textContent;
                            button.textContent = 'Uploaded!';
                            button.style.background = '#059669';
                            
                            setTimeout(() => {
                                button.textContent = originalText;
                                button.style.background = '#3b82f6';
                            }, 2000);
                        } else {
                            alert('Failed to upload file: ' + (response ? response.message : 'Unknown error'));
                        }
                    });
                    
                    fileInput.value = ''; // Clear the input
                };
                reader.readAsText(file);
            } else {
                alert('Please select a valid .txt file.');
            }
        });

        // Manual news entry handler
        document.getElementById('update-manual-news').addEventListener('click', () => {
            const content = document.getElementById('manual-news').value.trim();
            
            if (content) {
                // Send content to be saved as file
                nodecg.sendMessage('uploadTickerFile', content, (response) => {
                    if (response && response.success) {
                        // Show success feedback
                        const button = document.getElementById('update-manual-news');
                        const originalText = button.textContent;
                        button.textContent = 'Updated!';
                        button.style.background = '#059669';
                        document.getElementById('manual-news').value = ''; // Clear the textarea
                        
                        setTimeout(() => {
                            button.textContent = originalText;
                            button.style.background = '#3b82f6';
                        }, 2000);
                    } else {
                        alert('Failed to update news: ' + (response ? response.message : 'Unknown error'));
                    }
                });
            } else {
                alert('Please enter some news content.');
            }
        });

        // Data update handlers
        document.getElementById('update-lower-third').addEventListener('click', () => {
            const title = document.getElementById('lower-third-title').value;
            const subtitle = document.getElementById('lower-third-subtitle').value;
            
            if (title || subtitle) {
                const updates = {};
                if (title) updates.title = title;
                if (subtitle) updates.subtitle = subtitle;
                
                nodecg.sendMessage('updateGraphicData', {
                    type: 'lowerThird',
                    updates: updates
                });
                
                // Clear inputs
                document.getElementById('lower-third-title').value = '';
                document.getElementById('lower-third-subtitle').value = '';
            }
        });

        document.getElementById('update-score').addEventListener('click', () => {
            const homeTeam = document.getElementById('home-team').value;
            const homeScore = document.getElementById('home-score').value;
            const awayTeam = document.getElementById('away-team').value;
            const awayScore = document.getElementById('away-score').value;
            
            const updates = {};
            if (homeTeam) updates.homeTeam = homeTeam;
            if (homeScore !== '') updates.homeScore = parseInt(homeScore);
            if (awayTeam) updates.awayTeam = awayTeam;
            if (awayScore !== '') updates.awayScore = parseInt(awayScore);
            
            if (Object.keys(updates).length > 0) {
                nodecg.sendMessage('updateGraphicData', {
                    type: 'score',
                    updates: updates
                });
                
                // Clear inputs
                document.getElementById('home-team').value = '';
                document.getElementById('home-score').value = '';
                document.getElementById('away-team').value = '';
                document.getElementById('away-score').value = '';
            }
        });
    </script>
</body>
</html>
